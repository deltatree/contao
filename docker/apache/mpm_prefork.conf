# Grenzen für Apache prefork (Störung 2026-10-11, Stack diesiegl).
# Vorher galt der Debian-Standard: bis zu 150 Prozesse, nie erneuert. Bei einem Schwung
# gleichzeitiger Anfragen starteten 75 Prozesse; das riss die Speichergrenze von 1 Gi,
# und der Knoten beendete den ganzen Container. Jetzt warten überzählige Anfragen kurz.
# Faustregel: je Prozess rund 35 MB eigener Speicher, dazu einmal bis 192 MB OPcache.
# 20 Prozesse passen damit in 1 Gi. Wer mehr Speicher gibt, hebt die Zahl per Umgebungsvariable.
<IfModule mpm_prefork_module>
	StartServers             4
	MinSpareServers          2
	MaxSpareServers          6
	MaxRequestWorkers        ${APACHE_MAX_REQUEST_WORKERS}
	MaxConnectionsPerChild   ${APACHE_MAX_CONNECTIONS_PER_CHILD}
</IfModule>
